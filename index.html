<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أبراك للعطور - فخامة تليق بك</title>
<style>
body{margin:0;font-family:Tahoma;background:#0e0e0e;color:#f5e6c8}
header{padding:60px 20px;text-align:center;background:linear-gradient(#1c1c,#0e0e0e);border-bottom:1px solid #2a2a2a}
header h1{color:#d4af37;margin:0;font-size:34px}
header p{color:#a89a7a;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}
.card{background:#1a1a1a;border-radius:20px;overflow:hidden;text-align:center;border:1px solid #2a2a2a;padding-bottom:12px}
.card img{width:100%;height:190px;object-fit:cover}
.card h3{margin:10px 0 4px 0;font-size:15px;color:#fff}
.price{color:#d4af37;font-weight:bold}
button{width:85%;margin-top:8px;background:#d4af37;color:#111;border:none;padding:11px;border-radius:12px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>أبراك للعطور ✨</h1>
<p>عطرك يوصفك قبل ما تتكلم</p>
</header>
<div class="grid">
<div class="card">
<img src="https://images.unsplash.com/photo-1541643600914-78b084683601?w=500">
<h3>عطر أبراك الخاص</h3>
<div class="price">15,000 ج.س</div>
<button onclick="location.href='https://wa.me/249905190175?text=عايز عطر أبراك الخاص'">طلب واتساب</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500">
<h3>مسك ملكي</h3>
<div class="price">12,000 ج.س</div>
<button onclick="location.href='https://wa.me/249905190175?text=عايز مسك ملكي'">طلب واتساب</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500">
<h3>عطر نسائي فاخر</h3>
<div class="price">18,000 ج.س</div>
<button onclick="location.href='https://wa.me/249905190175?text=عايز عطر نسائي'">طلب واتساب</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1582211594533-268f4a00a8cb?w=500">
<h3>بخور أصلي</h3>
<div class="price">9,000 ج.س</div>
<button onclick="location.href='https://wa.me/249905190175?text=عايز بخور'">طلب واتساب</button>
</div>
</div>
</body>
</html>
